<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff9ec7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="なつみポイント">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>なつみポイント</title>
<style>
:root{--pink:#ff9ec7;--pink2:#ffd6e8;--bg:#fff5fa;--mint:#8fe3cf;--yellow:#ffe27a;--text:#5a3b4d;--card:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;padding-bottom:90px}
header{background:linear-gradient(135deg,#ffb3d4,#ff8fbf);color:#fff;text-align:center;padding:calc(env(safe-area-inset-top) + 16px) 16px 28px;border-radius:0 0 32px 32px;box-shadow:0 4px 14px #ff8fbf66}
header h1{margin:0;font-size:16px;letter-spacing:1px}
.pts{font-size:56px;font-weight:800;line-height:1.1;text-shadow:0 3px 0 #e8689f}
.pts small{font-size:20px;margin-left:4px}
main{padding:16px;max-width:560px;margin:0 auto}
.card{background:var(--card);border-radius:20px;padding:14px;margin-bottom:14px;box-shadow:0 3px 10px #ff9ec733;border:2px solid var(--pink2)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.name{font-weight:800;font-size:17px;flex:1}
.sub{font-size:12px;opacity:.7}
button{font:inherit;border:0;border-radius:999px;padding:10px 16px;font-weight:800;color:#fff;background:var(--pink);box-shadow:0 3px 0 #e8689f;cursor:pointer}
button:active{transform:translateY(3px);box-shadow:none}
button.mint{background:#4fcfb0;box-shadow:0 3px 0 #2fa88a}
button.yellow{background:#ffc83d;box-shadow:0 3px 0 #d9a21c;color:#6b4a00}
button.gray{background:#c9b7c2;box-shadow:0 3px 0 #a897a1}
button.small{padding:6px 12px;font-size:13px}
button:disabled{opacity:.45}
.mults{display:flex;gap:8px;margin-top:10px}
.mults button{flex:1;font-size:16px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:2px solid var(--pink2);padding-bottom:env(safe-area-inset-bottom);border-radius:22px 22px 0 0;box-shadow:0 -3px 12px #ff9ec733}
nav button{flex:1;background:none;color:#b68fa5;box-shadow:none;border-radius:0;padding:10px 0 8px;font-size:11px}
nav button span{display:block;font-size:24px}
nav button.on{color:#ff5fa2}
h2{font-size:16px;margin:4px 0 10px}
input{font:inherit;padding:10px 12px;border-radius:14px;border:2px solid var(--pink2);width:100%;background:#fff;color:var(--text)}
.f{display:flex;gap:8px;margin-bottom:8px}.f>*{flex:1}
label{font-size:12px;display:block;margin-bottom:2px}
.hist{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px dashed var(--pink2);font-size:14px}
.plus{color:#e8689f;font-weight:800}.minus{color:#2fa88a;font-weight:800}
.toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(.6);background:#fff;border:3px solid var(--pink);border-radius:24px;padding:18px 26px;font-size:20px;font-weight:800;opacity:0;pointer-events:none;transition:.25s;text-align:center;z-index:9}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.empty{text-align:center;opacity:.6;padding:20px}
</style>
</head>
<body>
<header><h1>🌸 なつみポイント 🌸</h1><div class="pts"><span id="pts">0</span><small>ポイント</small></div></header>
<main id="main"></main>
<nav id="nav"></nav>
<div class="toast" id="toast"></div>
<script>
const KEY='natsumi-point-v1';
const defaults=()=>({chores:[{id:1,name:'マッサージ',minutes:20,base:100,mults:[1,2,3]}],rewards:[{id:1,name:'UFOキャッチャー1回(100円)',cost:100}],history:[],nextId:2});
let S;try{S=JSON.parse(localStorage.getItem(KEY))||defaults()}catch(e){S=defaults()}
// 保存: localStorage + IndexedDB(二重保存)。ブラウザに消されにくいよう永続化も要求
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('natsumi-point',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej()});
const idbPut=v=>idb().then(d=>{d.transaction('kv','readwrite').objectStore('kv').put(v,KEY)}).catch(()=>{});
const idbGet=()=>idb().then(d=>new Promise(res=>{const q=d.transaction('kv').objectStore('kv').get(KEY);q.onsuccess=()=>res(q.result);q.onerror=()=>res()})).catch(()=>{});
let warned=false;
const save=()=>{const j=JSON.stringify(S);try{localStorage.setItem(KEY,j)}catch(e){if(!warned){warned=true;alert('保存に失敗しました。プライベートモードでないか確認してください')}}idbPut(j)};
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
// localStorageが空でIndexedDBに残っていれば復元
if(!localStorage.getItem(KEY))idbGet().then(v=>{if(v){try{S=JSON.parse(v);localStorage.setItem(KEY,v);render()}catch(e){}}});
const balance=()=>S.history.reduce((a,h)=>a+h.pts,0);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tab='chores',editing=false;
const tabs=[['chores','🧹','お手伝い'],['rewards','🎁','ご褒美'],['history','📒','きろく'],['settings','⚙️','せってい']];
function toast(t){const e=document.getElementById('toast');e.innerHTML=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1400)}
function addHist(type,name,pts){S.history.unshift({id:S.nextId++,t:Date.now(),type,name,pts});save()}
function doChore(id,m){const c=S.chores.find(x=>x.id==id);const p=c.base*m;addHist('chore',c.name+(m>1?` ×${m}倍`:''),p);toast(`🎉 ${esc(c.name)}<br>+${p}ポイント!`);render()}
function doReward(id){const r=S.rewards.find(x=>x.id==id);if(balance()<r.cost)return;if(!confirm(`「${r.name}」を ${r.cost}ポイントで交換しますか?`))return;addHist('reward',r.name,-r.cost);toast(`🎁 ${esc(r.name)}<br>こうかん!`);render()}
function undo(id){if(!confirm('この記録を取り消しますか?'))return;S.history=S.history.filter(h=>h.id!=id);save();render()}
function fld(kind,id,f,v){const o=S[kind].find(x=>x.id==id);o[f]=(f==='name')?v:Math.max(0,parseInt(v)||0);save();document.getElementById('pts').textContent=balance()}
function setMults(id,v){const o=S.chores.find(x=>x.id==id);const a=v.split(/[,、\s]+/).map(Number).filter(n=>n>0);o.mults=a.length?a:[1];save();render()}
function add(kind){S[kind].push(kind==='chores'?{id:S.nextId++,name:'新しいお手伝い',minutes:0,base:100,mults:[1,2,3]}:{id:S.nextId++,name:'新しいご褒美',cost:100});save();render()}
function del(kind,id){if(!confirm('削除しますか?'))return;S[kind]=S[kind].filter(x=>x.id!=id);save();render()}
function fmt(t){const d=new Date(t);return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
function editBar(kind){return `<div class="row" style="margin-bottom:10px"><button class="${editing?'yellow':'gray'} small" onclick="editing=!editing;render()">${editing?'✅ へんしゅう終わり':'✏️ へんしゅうする'}</button><button class="mint small" onclick="add('${kind}')">＋ ついか</button></div>`}
function choreCard(c){
  if(editing)return `<div class="card"><div class="f"><div style="flex:2"><label>お手伝いの名前</label><input value="${esc(c.name)}" onchange="fld('chores',${c.id},'name',this.value)"></div><div><label>分</label><input type="number" inputmode="numeric" value="${c.minutes}" onchange="fld('chores',${c.id},'minutes',this.value);render()"></div></div><div class="f"><div><label>ベースポイント</label><input type="number" inputmode="numeric" value="${c.base}" onchange="fld('chores',${c.id},'base',this.value)"></div><div><label>倍率ボタン(カンマ区切り)</label><input value="${c.mults.join(',')}" onchange="setMults(${c.id},this.value)"></div></div><button class="gray small" onclick="del('chores',${c.id})">🗑 削除</button></div>`;
  return `<div class="card"><div class="row"><div class="name">${esc(c.name)}</div><div class="sub">${c.minutes?c.minutes+'分 / ':''}ベース ${c.base}pt</div></div><div class="mults">${c.mults.map(m=>`<button class="${m==1?'':m==2?'yellow':'mint'}" onclick="doChore(${c.id},${m})">${m==1?'ふつう':m+'倍'}<br><small>+${c.base*m}</small></button>`).join('')}</div></div>`}
function rewardCard(r){
  if(editing)return `<div class="card"><div class="f"><div style="flex:2"><label>ご褒美の名前</label><input value="${esc(r.name)}" onchange="fld('rewards',${r.id},'name',this.value)"></div><div><label>必要ポイント</label><input type="number" inputmode="numeric" value="${r.cost}" onchange="fld('rewards',${r.id},'cost',this.value)"></div></div><button class="gray small" onclick="del('rewards',${r.id})">🗑 削除</button></div>`;
  const ok=balance()>=r.cost;
  return `<div class="card"><div class="row"><div class="name">${esc(r.name)}</div><div class="sub">${r.cost}pt</div><button ${ok?'':'disabled'} onclick="doReward(${r.id})">${ok?'こうかん':'あと'+(r.cost-balance())}</button></div></div>`}
function render(){
  document.getElementById('pts').textContent=balance();
  document.getElementById('nav').innerHTML=tabs.map(([k,i,l])=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';editing=false;render()"><span>${i}</span>${l}</button>`).join('');
  let h='';
  if(tab=='chores')h=`<h2>🧹 お手伝いをしたらタップ!</h2>`+editBar('chores')+(S.chores.map(choreCard).join('')||'<div class="empty">お手伝いを追加してね</div>');
  else if(tab=='rewards')h=`<h2>🎁 ご褒美とこうかん</h2>`+editBar('rewards')+(S.rewards.map(rewardCard).join('')||'<div class="empty">ご褒美を追加してね</div>');
  else if(tab=='history')h=`<h2>📒 きろく</h2><div class="card">`+(S.history.length?S.history.slice(0,100).map(x=>`<div class="hist"><div><div>${esc(x.name)}</div><div class="sub">${fmt(x.t)}</div></div><div><span class="${x.pts>0?'plus':'minus'}">${x.pts>0?'+':''}${x.pts}</span> <button class="gray small" onclick="undo(${x.id})">取消</button></div></div>`).join(''):'<div class="empty">まだ記録がありません</div>')+`</div>`;
  else h=`<h2>⚙️ せってい</h2><div class="card"><div class="sub" style="margin-bottom:8px">データはこのスマホの中だけに保存されます(同じブラウザで開いてください)。お手伝い・ご褒美の内容やポイントは「お手伝い」「ご褒美」タブの「へんしゅう」からいつでも変えられます。</div><button class="mint small" onclick="exportData()">📤 バックアップを保存</button> <button class="yellow small" onclick="document.getElementById('imp').click()">📥 バックアップを読み込む</button><input type="file" id="imp" accept=".json" hidden onchange="importData(this.files[0])"><div style="height:12px"></div><button class="gray small" onclick="resetAll()">🗑 全部リセット</button></div>`;
  document.getElementById('main').innerHTML=h;
}
function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='otetsudai-backup.json';a.click()}
function importData(f){if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!d.chores||!d.rewards||!d.history)throw 0;S=d;save();render();toast('読み込みました')}catch(e){alert('読み込めませんでした')}})}
function resetAll(){if(confirm('ポイントも項目も全部消えます。よろしいですか?')&&confirm('本当にリセットしますか?')){S=defaults();save();render()}}
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
